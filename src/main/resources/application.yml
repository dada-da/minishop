spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: minishop-api
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minishop}
    username: ${DB_USERNAME:minishop}
    password: ${DB_PASSWORD:minishop}
  jpa:
    hibernate:
      ddl-auto: validate        # schema do Flyway quản lý, JPA chỉ validate
    open-in-view: false          # tắt OSIV - tránh lazy-loading ngoài service layer (talking point phỏng vấn)
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true

# Cau hinh JWT (doc tu bien moi truong, KHONG hardcode secret)
app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-random-base64-secret-in-production}
    access-token-expiration-ms: 900000        # 15 phut
    refresh-token-expiration-ms: 604800000    # 7 ngay

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: INFO
